name: Release

# Tag push `vX.Y.Z` builds, signs and attests the release artifacts:
#   - container image (ghcr.io), multi-arch, keyless cosign signature, GitHub artifact attestation,
#     SLSA Build L3 provenance from slsa-framework/slsa-github-generator
#   - source tarball (deterministic `git archive`) + CycloneDX SBOM, each with a cosign bundle,
#     a GitHub artifact attestation and SLSA provenance (.intoto.jsonl)
# All of it is attached to the GitHub release. Verification: docs/process/VERIFY-RELEASE.md.
# Decision record: governance/ADR-017-supply-chain-and-release-integrity.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  image:
    name: Build, sign and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # OCI references must be lower case; cosign rejects the mixed-case repository name.
      - name: Normalize image name
        id: name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SOURCE_DATE_EPOCH + rewrite-timestamp=true make the layer timestamps a function of the
      # commit, so the per-platform image manifests can be rebuilt bit for bit
      # (checked on every push by the reproducible-build job in ci.yml).
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=registry,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.name.outputs.epoch }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: GitHub artifact attestation (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  source:
    name: Source tarball, SBOM and signatures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm

      - name: Build tarball and SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-assets
          # git archive stamps every entry with the commit time; gzip -n drops the name/mtime header.
          git archive --format=tar --prefix="akac-${TAG}/" HEAD | gzip -n -9 > "release-assets/akac-${TAG}.tar.gz"
          npm ci --ignore-scripts
          npm sbom --sbom-format cyclonedx > "release-assets/akac-${TAG}.sbom.cdx.json"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3

      - name: Sign tarball and SBOM (keyless, cosign bundles)
        working-directory: release-assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for f in "akac-${TAG}.tar.gz" "akac-${TAG}.sbom.cdx.json"; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done

      - name: GitHub artifact attestation for the tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-assets/akac-${{ github.ref_name }}.tar.gz

      - name: Subject hashes for the SLSA generator
        id: hash
        working-directory: release-assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "hashes=$(sha256sum "akac-${TAG}.tar.gz" "akac-${TAG}.sbom.cdx.json" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  # slsa-framework/slsa-github-generator reusable workflows MUST be referenced by tag `@vX.Y.Z`
  # (not by commit SHA): slsa-verifier resolves the builder identity from the ref, and a SHA or a
  # short tag makes the generator fail. This is documented by that project (README, "Referencing
  # SLSA builders and generators"). v2.1.0 resolves to f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
  # (checked when this file was written); the tag is the only pin the generator supports.
  # The project states it is no longer actively maintained (GitHub artifact attestations above
  # are the recommended successor); see ADR-017.
  provenance-image:
    name: SLSA provenance (image)
    needs: image
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  provenance-source:
    name: SLSA provenance (tarball and SBOM)
    needs: source
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.source.outputs.hashes }}
      provenance-name: akac-${{ github.ref_name }}.intoto.jsonl

  release:
    name: Publish GitHub release
    needs: [image, source, provenance-image, provenance-source]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: release-assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: akac-${{ github.ref_name }}.intoto.jsonl
          path: release-assets

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l release-assets
          (cd release-assets && sha256sum * > "akac-${TAG}.SHA256SUMS")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --title "$TAG" --generate-notes
          fi
