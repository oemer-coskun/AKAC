name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 3 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          category: /language:javascript-typescript
          output: codeql-results
          # Private repos without GitHub Code Security cannot upload SARIF to Code Scanning.
          # Analysis still runs and is retained as an artifact.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

      - name: Preserve CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-sarif
          path: codeql-results
          if-no-files-found: warn
          retention-days: 14
